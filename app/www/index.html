<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0071BB">
<title>ClaimPulse — Working Demo | Team Finsighters · ATOM Season 9</title>
<meta name="description" content="ClaimPulse — Motor OD claims orchestration. Capture Integrity Gate, five engines, Trust Score routing. Team Finsighters, NMIMS Mumbai, PS_BFDL.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-180.png">

<!-- Add to Home Screen on iOS: without these the page opens in Safari
     chrome rather than full screen, which reads as a website, not an app. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ClaimPulse">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Same two families, and the same weight set, as the ClaimPulse
     executive simulator, so the two surfaces read as one product. -->
<script src="assets/js/theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/theme.css">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<!-- Bajaj Finserv - fixed top-right on every surface. See theme.css. -->
<div class="bf-logo" role="img" aria-label="Bajaj Finserv"></div>


<!-- ============================ LEFT RAIL ============================
     Numbered, iconed and fixed, exactly as on the executive simulator, so
     moving between the two halves of ClaimPulse does not feel like moving
     between two products. Eight surfaces do not fit across a topbar at a
     readable size anyway; a rail scales where a topbar would have had to
     start truncating.                                                    -->
<aside class="navrail">
  <a class="navrail-logo" href="../" title="Executive Decision Simulator — the business case">
    <span>CP</span><span>S9</span>
  </a>
  <nav class="navrail-nav" id="surfaceNav"></nav>
</aside>

<div class="shell">

  <!-- ============================ TOP BAR ============================ -->
  <!-- The simulator's .top-bar, replicated. Same lockup, same card treatment,
       same actions cluster — so crossing from the case to the floor does not
       change the furniture, only what is on the desk. -->
  <header class="top-bar">
    <div class="brand-group">
      <div class="brand-logo-wrap">
        <div style="font-family:var(--f-head);font-weight:700;font-size:12px;color:var(--heading);">ATOM <span style="color:var(--brand-blue);">Season 9</span></div>
      </div>
      <div class="brand-title-box">
        <div class="crumb"><a href="../">ClaimPulse Home</a> <span>&rsaquo;</span> Demo</div>
        <h1>ClaimPulse</h1>
        <p id="surfaceTitle">Live Operations · Command Center · Team Finsighters · NMIMS Mumbai · PS_BFDL</p>
      </div>
    </div>
    <div class="header-actions">
      <a href="../simulator" class="btn-download-pill btn-sim" title="Executive Decision Simulator — the business case">
        <span class="dl-icon-circle">&#9650;</span>
        <span>Executive Simulator</span>
      </a>
      <button class="syncpill" id="syncPill" onclick="CPApp.share()" title="Share this demo / sync status">
        <span class="dot"></span><span id="syncTxt">connecting</span>
      </button>
    </div>
  </header>

  <div id="pilotBar"></div>

  <main class="stage">

    <!-- ============ 3 · CUSTOMER MOBILE APP ============ -->
    <section class="view on" id="v-claimant">
      <div class="phonewrap">
        <div class="phone">
          <div class="phone-status">
            <span id="phClock">09:41</span>
            <span>ClaimPulse · Bajaj General</span>
            <span>▮▮▮</span>
          </div>
          <div class="steps" id="phSteps"><i class="on"></i><i></i><i></i><i></i><i></i></div>
          <div class="phone-head">
            <div class="t" id="phTitle">Report a claim</div>
            <div class="s" id="phSub">Motor Own Damage · FNOL</div>
          </div>
          <div class="phone-body" id="phBody"></div>
          <div class="phone-foot" id="phFoot"></div>
        </div>

        <div class="sidenote" id="sideNote"></div>
      </div>
    </section>

    <!-- ============ 1 · CLAIMS COMMAND CENTER ============ -->
    <section class="view" id="v-ops">
      <!-- The page title and its breadcrumb live in the shell header now,
           so this row carries only the clock. Saying "Command Center" twice
           on one screen is the kind of thing that makes a workspace read as
           a separate application. -->
      <div class="pagehead">
        <div class="deskclock" id="deskClock"></div>
      </div>

      <div class="execlead" id="execLead"></div>
      <div class="execband" id="execBand"></div>

      <div class="split">
        <div id="lanePanel"></div>
        <div id="autoPanel"></div>
      </div>

    </section>

    <!-- ============ 2 · CLAIM INSPECTOR ============ -->
    <!-- The queue lives HERE, not on the Command Center. Picking a claim and
         reading a claim are the same job; the dashboard's job is the shape of
         the day, and it was carrying a twelve-column table that belonged to
         this screen. -->
    <section class="view" id="v-inspector">
      <!-- Filters sit beside the queue, not above it. A filter is a control
           you hold while reading the result; stacking it on top pushes the
           result under the fold every time you change your mind. -->
      <div class="queuelayout">
        <div id="filterRail"></div>
        <div class="card flush">
          <div class="queuehead" id="queueHead"></div>
          <div id="queueTable"></div>
        </div>
      </div>
      <div id="inspBody"></div>
    </section>

    <!-- ==================== 3 · GARAGE & SURVEYOR ==================== -->
    

    <!-- ==================== 4 · AUDIT / REGULATOR ==================== -->
    

    <!-- ==================== 5 · IMPACT BOARD ==================== -->
    

    <!-- ============ PILOT WORKSPACE ============ -->
    

    <!-- ==================== 6 · INVESTOR SIMULATOR ==================== -->
    

    <!-- ============ 3 · GARAGES · who repairs the vehicle ============ -->
    <section class="view" id="v-garages">
      <div class="kpirow k4" id="garKpis"></div>
      <div id="garMain"></div>
    </section>
    <!-- ============ 4 · SURVEYORS · who verifies the damage ============ -->
    <section class="view" id="v-surveyors">
      <div class="kpirow k4" id="svKpis"></div>
      <div class="split"><div id="svMain"></div><div id="svSide"></div></div>
    </section>
    <!-- ============ 6 · DECISION · the case, the levers, the pilot ============
         Four things that all answer "should we do this and how do we know",
         behind one tab with internal sections. They were four top-level tabs,
         which made the product look like it had four business cases. -->
    <section class="view" id="v-decision">
      <div class="subtabs" id="decisionTabs"></div>
<div class="subview" id="d-impact">
      <div id="impactBody"></div>
    </div>
<div class="subview" id="d-sim">
      <div class="split-r">
        <div id="simLevers"></div>
        <div id="simBody"></div>
      </div>
    </div>
<div class="subview" id="d-pilot">
      <div id="pilotBody"></div>
    </div>
<div class="subview" id="d-audit">
      <div class="kpirow k4" id="auditKpis"></div>
      <div class="split-r">
        <div id="auditSide"></div>
        <div id="auditMain"></div>
      </div>
    </div>
    </section>
  </main>
</div>

<div id="sheetHost"></div>

<script src="assets/js/model.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/engine.js"></script>
<script src="assets/js/sync.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/claimant.js"></script>
<script src="assets/js/ops.js"></script>
<script src="assets/js/inspector.js"></script>
<script src="assets/js/network.js"></script>
<script src="assets/js/audit.js"></script>
<script src="assets/js/impact.js"></script>
<script src="assets/js/sim.js"></script>
<script src="assets/js/pilot.js"></script>
<script src="assets/js/decision.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
